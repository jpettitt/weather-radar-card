name: "Build"

on:
  push:
    branches:
      - main
      # Long-lived release branches such as 4.0, which take merged PRs too.
      - '[0-9]+.[0-9]+'
  # Every PR, whatever its base: PRs into 4.0 used to merge with no checks.
  pull_request:
  workflow_dispatch:

# Cancel an older run of the same workflow on the same ref when a new push
# arrives. Saves CI minutes on rapid force-pushes / quick fixups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 builds the releases; 22 is the older supported LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Test
        if: matrix.node-version != 24
        run: npm test

      - name: Test with coverage
        if: matrix.node-version == 24
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build
